name: Google Places Dataset - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Export local-business search records for a location-aware research or
          data-quality workflow.
        id: data
        uses: rocosen/flashdata-google-places-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          query: coworking Singapore
          options-json: '{"num":5}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: google-places
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
